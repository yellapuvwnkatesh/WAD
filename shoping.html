<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora</title>
    <!-- <link rel="stylesheet" href="shoping.css"> -->
    <style>
        /* General Reset */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    line-height: 1.6;
    background-color: #f9f9f9;
    color: #333;
}

/* Header */
header {
     /* background: #007bff; */
    background-color: #4CAF50; 
    color: #fff;
    padding: 1em 0;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 2em;
}

header nav {
    margin-top: 10px;
}

header nav a {
    color: #fff;
    text-decoration: none;
    margin: 0 10px;
    padding: 5px 10px;
    border-radius: 5px;
    /* background: #0056b3; */
    
    transition: background 0.3s ease;
}

header nav a:hover {
    background: #003f7f;
}

/* Main Section */
main {
    padding: 20px;
}

#products {
    max-width: 1200px;
    margin: 0 auto;
    text-align: center;
}

.product-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
}

.product {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 15px;
    width: 300px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    text-align: center;
    transition: transform 0.3s ease;
}

.product:hover {
    transform: translateY(-5px);
}

.product img {
    max-width: 100%;
    height: auto;
    border-radius: 10px;
    margin-bottom: 15px;
}

/* Buttons */
button {
    cursor: pointer;
    padding: 10px 15px;
    font-size: 1em;
    border: none;
    border-radius: 5px;
    transition: background 0.3s ease;
}

.add-to-cart {
    background: #28a745;
    color: #fff;
    margin: 10px 5px 0 0;
}

.add-to-cart:hover {
    background: #218838;
}

.delete-product {
    background: #dc3545;
    color: #fff;
}

.delete-product:hover {
    background: #c82333;
}

/* Footer */
footer {
    background: #333;
    color: #fff;
    text-align: center;
    padding: 20px 0;
    margin-top: 20px;
}

    </style>
</head>

<body>
    <header>
        <h1>Welcome to Nexora</h1>
        <nav>
            <a href="register.html">Signup</a>
            <a href="signin.html">Signin</a>
            <a href="onlinewebservice.html">About</a>
            <a href="cart.html">Cart</a>
        </nav>
    </header>

    <main>
        <section id="products">
            <h2>Our Products</h2>
            <div class="product-container">
                <article class="product">
                    <h3>Product 1</h3>
                    <img src="camara.jpg" alt="DSLR Camera">
                    <p>This is a DSLR Camera</p>
                    <p>Price: $10,000</p>
                    <button class="add-to-cart">Add to Cart</button>
                    <button class="delete-product">Delete</button>
                </article>
                <article class="product">
                    <h3>Product 2</h3>
                    <img width="250" height="250" src="shopping1.jpg" alt="iPhone">
                    <p>An iPhone</p>
                    <p>Price: $20.00</p>
                    <button class="add-to-cart">Add to Cart</button>
                    <button class="delete-product">Delete</button>
                </article>
                <article class="product">
                    <h3>Product 3</h3>
                    <img width="250" height="250" src="Product+Showcase-1.jpg" alt="Shoe">
                    <p>A Shoe</p>
                    <p>Price: $30.00</p>
                    <button class="add-to-cart">Add to Cart</button>
                    <button class="delete-product">Delete</button>
                </article>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Nexora. All rights reserved.</p>
        <p>Email: contact@nexora.com</p>
        <p>Phone: (123) 456-7890</p>
    </footer>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
    const products = [
        { id: 1, name: "DSLR Camera", image: "camara.jpg", description: "This is a DSLR Camera", price: 10000 },
        { id: 2, name: "iPhone", image: "shopping1.jpg", description: "An iPhone", price: 20 },
        { id: 3, name: "Shoe", image: "Product+Showcase-1.jpg", description: "A Shoe", price: 30 }
    ];

    const productContainer = document.querySelector(".product-container");
    let cart = {};

    function renderProducts() {
        productContainer.innerHTML = "";
        products.forEach(product => {
            const productElement = document.createElement("article");
            productElement.classList.add("product");
            productElement.innerHTML = `
                <h3>${product.name}</h3>
                <img src="${product.image}" alt="${product.name}">
                <p>${product.description}</p>
                <p>Price: $${product.price}</p>
                <p>Quantity: <span id="qty-${product.id}">0</span></p>
                <button class="add-to-cart" data-id="${product.id}">Add to Cart</button>
                <button class="delete-product" data-id="${product.id}">Delete</button>
            `;
            productContainer.appendChild(productElement);
        });
    }

    function updateQuantity(productId) {
        const quantityElement = document.getElementById(`qty-${productId}`);
        quantityElement.textContent = cart[productId] || 0;
    }

    function addToCart(productId) {
        if (!cart[productId]) {
            cart[productId] = 0;
        }
        cart[productId]++;
        updateQuantity(productId);
    }

    function deleteProduct(productId) {
        if (cart[productId] && cart[productId] > 0) {
            cart[productId]--;
            updateQuantity(productId);
        }
    }

    productContainer.addEventListener("click", (event) => {
        const productId = event.target.dataset.id;
        if (event.target.classList.contains("add-to-cart")) {
            addToCart(productId);
        } else if (event.target.classList.contains("delete-product")) {
            deleteProduct(productId);
        }
    });

    renderProducts();
});

    </script>
</body>

</html>
